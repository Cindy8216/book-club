<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title景仁宮豈容你放（4） </title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#ECE6D6;
    --paper-raised:#F4EFE2;
    --ink:#2B2822;
    --ink-soft:#5A5346;
    --indigo:#2F4A57;
    --brass:#A2703B;
    --moss:#63704A;
    --line:rgba(43,40,34,0.16);
    --line-strong:rgba(43,40,34,0.30);
    --card-shadow: 0 1px 0 rgba(43,40,34,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1D2126;
      --paper-raised:#242A31;
      --ink:#E9E3D3;
      --ink-soft:#B4AC98;
      --indigo:#8FB6C4;
      --brass:#D9A15E;
      --moss:#9CB07C;
      --line:rgba(233,227,211,0.14);
      --line-strong:rgba(233,227,211,0.26);
      --card-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.75;
  }
  .page{ max-width:680px; margin:0 auto; padding:4rem 1.5rem 5rem; }
  header{ text-align:center; padding-bottom:2.2rem; border-bottom:2px solid var(--line-strong); margin-bottom:2.6rem; }
  .eyebrow{ font-size:0.8rem; letter-spacing:0.3em; color:var(--brass); font-weight:600; margin-bottom:1rem; }
  h1{ font-family:"Noto Serif TC",serif; font-weight:900; font-size:clamp(2rem,5vw,2.5rem); margin:0 0 0.7rem; text-wrap:balance; }
  .subtitle{ color:var(--ink-soft); font-size:1rem; max-width:34em; margin:0 auto; }
  .list{ display:flex; flex-direction:column; gap:1rem; }
  a.entry{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:1rem;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1.1rem 1.3rem;
    box-shadow:var(--card-shadow);
    text-decoration:none;
    color:inherit;
  }
  a.entry:hover{ border-color:var(--indigo); }
  .entry .month{
    font-variant-numeric: tabular-nums;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    color:var(--brass);
    font-size:0.9rem;
    white-space:nowrap;
  }
  .entry .titles{ min-width:0; }
  .entry .book-title{ font-family:"Noto Serif TC",serif; font-weight:700; font-size:1.05rem; color:var(--ink); }
  .entry .book-author{ font-size:0.85rem; color:var(--ink-soft); }
  .entry .go{ color:var(--indigo); font-size:1.2rem; }
  footer{ margin-top:3rem; padding-top:1.4rem; border-top:1px solid var(--line); text-align:center; color:var(--ink-soft); font-size:0.85rem; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">READING CLUB</div>
    <h1>景仁宮豈容你放（4） </h1>
    <p class="subtitle">不只是抱怨同事，我們決定讀點書。每月一本，這裡收著每一次的討論引導單。</p>
  </header>

  <div class="list">
    <a class="entry" href="guides/2026-08/">
      <span class="month">2026 · 09</span>
      <span class="titles">
        <div class="book-title">老派少女購物路線</div>
        <div class="book-author">洪愛珠</div>
      </span>
      <span class="go">→</span>
    </a>
  </div>

  <footer>之後每個月的選書，都會加在這個列表裡。</footer>
</div>
</body>
</html>
